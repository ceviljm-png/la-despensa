<!-- Pantalla de inicio -->
<main id="menu" class="menu">
  <div class="menu-card">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4l24.2 14v28L32 60 7.8 46V18z" fill="#f6ecd8" stroke="#7a2e3f" stroke-width="3" stroke-linejoin="round"/>
        <use href="#i-aceite" x="18" y="16" width="28" height="28"/>
      </svg>
      <div>
        <h1>La Despensa</h1>
        <p>Cultiva, comercia y llena la despensa de la isla</p>
      </div>
    </header>

    <button id="btn-continue" class="btn wide" hidden>Continuar partida</button>

    <h2>Tipo de partida</h2>
    <div class="modes" id="modes">
      <label class="mode"><input type="radio" name="mode" value="sencilla">
        <span><b>Sencilla</b><small>Huertas, bodegas, caminos y cambios 4:1 con la banca. A 8 puntos.</small></span></label>
      <label class="mode"><input type="radio" name="mode" value="clasica" checked>
        <span><b>Clásica</b><small>Añade puertos, cartas de cocina, Gran Ruta y Gran Brigada. A 10 puntos.</small></span></label>
      <label class="mode"><input type="radio" name="mode" value="completa">
        <span><b>Completa</b><small>Todo lo anterior y además cambios entre jugadores.</small></span></label>
    </div>

    <h2>Jugadores</h2>
    <div class="slots" id="slots"></div>

    <button id="btn-start" class="btn primary wide">Empezar partida</button>
    <button id="btn-rules" class="btn ghost wide">Cómo se juega</button>
  </div>
</main>

<!-- Partida -->
<div id="game" class="game" hidden>
  <header class="topbar">
    <button id="btn-menu" class="iconbtn" aria-label="Menú">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-title"><b>La Despensa</b><span id="goal"></span></div>
    <button id="btn-help" class="iconbtn" aria-label="Cómo se juega">?</button>
  </header>
  <div class="players" id="players"></div>
  <div class="board-wrap">
    <svg id="board" viewBox="-322 -304 644 608" role="img" aria-label="Tablero"></svg>
    <div class="dice" id="dice"></div>
  </div>
  <aside class="panel">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hand" id="hand"></div>
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
  </aside>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
